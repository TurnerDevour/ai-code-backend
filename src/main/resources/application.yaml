spring:
  application:
    name: ai-code-backend
  profiles:
    active:
      - dev
  session:
    timeout: 2592000

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi项目配置
springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.example.aicodebackend.controller

ai:
  models:
    # 阿里云百炼：DeepSeek 系列
    # key 必须与 AIModelTypeEnum.value 一致；模型名里带 "." 的要写成 "[xxx]"，
    # 否则 Spring 的宽松绑定会把 "." 当成层级分隔符（详见 AiModelProperties 的注释）。
    "[deepseek-v4.1-flash]":
      provider: bailian
      region: cn-beijing
      model-name: deepseek-v4.1-flash
      timeout: 600s
      # 百炼 deepseek-v4 系列的 max_tokens 与 thinking_budget 共用上限 393216（模型最大输出）
      max-tokens: 384000
      temperature: 0.3
      # 百炼会返回 reasoning_content，但历史轮次回传没有收益（还可能被网关拒绝），出站关闭
      return-thinking: true
      send-thinking: false
      # deepseek-v4 系列默认就开启思考，这里显式声明是为了与百炼其它模型保持一致；
      # 推理强度另有 reasoning-effort（low / high / max，默认 high；其中 low 仅本模型支持）
      enable-thinking: true
    deepseek-v4-pro:
      provider: bailian
      region: cn-beijing
      model-name: deepseek-v4-pro
      timeout: 600s
      max-tokens: 384000
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true
    # 阿里云百炼：Qwen 系列
    "[qwen3.8-max]":
      provider: bailian
      region: cn-beijing
      model-name: qwen3.8-max
      timeout: 600s
      max-tokens: 131072
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true
    "[qwen3.7-plus]":
      provider: bailian
      region: cn-beijing
      model-name: qwen3.7-plus
      timeout: 600s
      max-tokens: 131072
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true

  model-check:
    enabled: true
    timeout: 5s

# 截图临时目录
screenshot:
  temp:
    ttl-minutes: 60
    sweep-minutes: 10

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath*:/mapper/**/*.xml
  global-config:
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
