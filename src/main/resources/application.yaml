spring:
  application:
    name: ai-code-backend
  profiles:
    active:
      - docker
  session:
    timeout: 2592000

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi项目配置
springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.example.aicodebackend.controller

ai:
  # 所有模型共用的配置：各模型只写自己不一样的部分（模型名、max-tokens 等）
  model-defaults:
    provider: bailian
    region: cn-beijing
    timeout: 600s
    temperature: 0.3
    return-thinking: true
    send-thinking: false
    enable-thinking: true
    thinking-budget: 8192
  models:
    "[deepseek-v4.1-flash]":
      model-name: deepseek-v4.1-flash
      max-tokens: 393216
    deepseek-v4-pro:
      model-name: deepseek-v4-pro
      max-tokens: 393216
    # 阿里云百炼：Qwen 系列
    "[qwen3.8-max]":
      model-name: qwen3.8-max
      max-tokens: 131072
    "[qwen3.8-flash]":
      model-name: qwen3.8-flash
      max-tokens: 131072

  model-check:
    enabled: true
    timeout: 5s

# 截图临时目录
screenshot:
  temp:
    ttl-minutes: 60
    sweep-minutes: 10

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath*:/mapper/**/*.xml
  global-config:
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
