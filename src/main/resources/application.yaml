spring:
  application:
    name: ai-code-backend
  profiles:
    active:
      - dev
  session:
    timeout: 2592000

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi项目配置
springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.example.aicodebackend.controller

ai:
  models:
    "[deepseek-v4.1-flash]":
      provider: bailian
      region: cn-beijing
      model-name: deepseek-v4.1-flash
      timeout: 600s
      max-tokens: 384000
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true
      # 思考预算（token）：不设上限时模型遇到"做不到的需求"会反复推敲不收敛，
      # 前端思考面板表现为死循环；实测同一请求不设预算 10 分钟以上不停，设 1024 后 19 秒收敛
      thinking-budget: 8192
    deepseek-v4-pro:
      provider: bailian
      region: cn-beijing
      model-name: deepseek-v4-pro
      timeout: 600s
      max-tokens: 384000
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true
      thinking-budget: 8192
    # 阿里云百炼：Qwen 系列
    "[qwen3.8-max]":
      provider: bailian
      region: cn-beijing
      model-name: qwen3.8-max
      timeout: 600s
      max-tokens: 131072
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true
      thinking-budget: 8192
    "[qwen3.7-plus]":
      provider: bailian
      region: cn-beijing
      model-name: qwen3.7-plus
      timeout: 600s
      max-tokens: 131072
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true
      thinking-budget: 8192

  model-check:
    enabled: true
    timeout: 5s

# 截图临时目录
screenshot:
  temp:
    ttl-minutes: 60
    sweep-minutes: 10

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath*:/mapper/**/*.xml
  global-config:
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
