spring:
  application:
    name: ai-code-backend
  profiles:
    active:
      - dev
  session:
    timeout: 2592000

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi项目配置
springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.example.aicodebackend.controller

ai:
  # 所有模型共用的配置：各模型只写自己不一样的部分（模型名、max-tokens 等）
  model-defaults:
    provider: bailian
    region: cn-beijing
    timeout: 600s
    temperature: 0.3
    return-thinking: true
    send-thinking: false
    enable-thinking: true
    thinking-budget: 8192
  models:
    "[deepseek-v4.1-flash]":
      model-name: deepseek-v4.1-flash
      max-tokens: 393216
    deepseek-v4-pro:
      model-name: deepseek-v4-pro
      max-tokens: 393216
    # 阿里云百炼：Qwen 系列
    "[qwen3.8-max]":
      model-name: qwen3.8-max
      max-tokens: 131072
    "[qwen3.8-flash]":
      model-name: qwen3.8-flash
      max-tokens: 131072

  model-check:
    enabled: true
    timeout: 5s

  # 「思考跑飞」守卫（第二道防线）：默认阈值按所选模型的 thinking-budget 推导，通常不用配。
  #   字符上限 = thinking-budget × 4 字符/token × 1.5 安全系数（8192 预算 → 49152 字）
  #   时长上限 = max(10 分钟, thinking-budget ÷ 6 token/秒)（8192 预算 → 约 23 分钟）
  # 推导值一定比预算本身宽松：守卫若比预算更严，掐掉的就是预算内的合法推理
  # （曾因此误报"模型在思考阶段长时间没有产出"）。
  # thinking-budget 没配时用兜底值：60000 字 / 10 分钟。
  # 只有平台不按 thinking-budget 截断（推理真的无穷无尽）时才需要在这里手工收紧。
  thinking-guard:
    # max-chars: 49152
    # max-duration: 23m

# 截图临时目录
screenshot:
  temp:
    ttl-minutes: 60
    sweep-minutes: 10

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath*:/mapper/**/*.xml
  global-config:
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1
