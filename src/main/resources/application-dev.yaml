spring:
  application:
    name: ai-code-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: admin123
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      username: default
      password: admin123
      ttl: 3600 # Redis缓存过期时间，单位秒
      timeout: 10s
      connect-timeout: 5s
      jedis:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 10s
          time-between-eviction-runs: 30s
  threads:
    virtual:
      enabled: true

# knife4j的增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

deploy:
  queue:
    workers: 4
    max-queue-size: 32

# 截图临时目录
screenshot:
  temp:
    ttl-minutes: 60
    sweep-minutes: 10
logging:
  file:
    name: temp/logs/ai-code-backend.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7

ai:
  models:
    # DeepSeek 开放平台
    deepseek-flash:
      provider: deepseek
      base-url: https://api.deepseek.com
      model-name: deepseek-flash
      api-key: ${DEEPSEEK_API_KEY}
      timeout: 600s
      max-tokens: 384000
      temperature: 0.3
      return-thinking: true
      send-thinking: true
      log-requests: true
      log-responses: true
    deepseek-v4-pro:
      provider: deepseek
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-pro
      api-key: ${DEEPSEEK_API_KEY}
      timeout: 600s
      max-tokens: 384000
      temperature: 0.3
      return-thinking: true
      send-thinking: true
      log-requests: true
      log-responses: true
    # 阿里云百炼
    "[qwen3.8-max]":
      provider: bailian
      base-url: ${ALI_AI_BASE_URL}
      workspace-id: ${ALI_WORKSPACE_ID}
      region: cn-beijing
      model-name: qwen3.8-max
      api-key: ${ALI_AI_API_KEY}
      timeout: 600s
      max-tokens: 131072
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true
      log-requests: true
      log-responses: true
    "[qwen3.7-plus]":
      provider: bailian
      base-url: ${ALI_AI_BASE_URL}
      workspace-id: ${ALI_WORKSPACE_ID}
      region: cn-beijing
      model-name: qwen3.7-plus
      api-key: ${ALI_AI_API_KEY}
      timeout: 600s
      max-tokens: 131072
      temperature: 0.3
      return-thinking: true
      send-thinking: false
      enable-thinking: true
      log-requests: true
      log-responses: true

  model-check:
    enabled: true
    timeout: 5s

# 配置cos对象存储
cos:
  client:
    host: ${COS_HOST}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET_NAME}
    secret-id: ${COS_SECRET_ID}
    secret-key: ${COS_SECRET_KEY}
