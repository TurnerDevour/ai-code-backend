server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: ai-code-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: admin123
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath*:/mapper/**/*.xml
  global-config:
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1

# LangChain4j配置
langchain4j:
  open-ai:
#    chat-model:
    #      base-url: https://api.deepseek.com
    #      model-name: deepseek-flash  # deepseek-flash / deepseek-v4-pro，最大输出 384K
    #      api-key: ${DEEPSEEK_API_KEY}
    #      log-requests: true
    #      log-responses: true
    #      max-retries: 5
    #      timeout: 300s
    #      max-tokens: 384000
    #      response-format: json_object
    #      strict-json-schema: true
    streaming-chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-pro
      api-key: ${DEEPSEEK_API_KEY}
      log-requests: true
      log-responses: true
      max-retries: 5
      timeout: 600s
      max-tokens: 384000
