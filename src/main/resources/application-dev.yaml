spring:
  application:
    name: ai-code-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: admin123
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      username: default
      password: admin123
      ttl: 3600 # Redis缓存过期时间，单位秒

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# LangChain4j配置
langchain4j:
  open-ai:
    # 非流式模型：由 starter 自动装配，供 HTML / 多文件模式的非流式生成使用。
    # 注意：starter 只装配一个非流式模型，该路径不随应用所选 AI 模型类型变化；
    # 随应用切换模型的是下面的 models（流式），流式才是对话生成的实际路径。
    chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-flash
      api-key: ${DEEPSEEK_API_KEY}
      log-requests: true
      log-responses: true
      timeout: 600s
      max-tokens: 384000
      response-format: json_object
      strict-json-schema: true
    # 以 AI 模型类型枚举（AIModelTypeEnum.value）为 key，为每个模型各构建一个 StreamingChatModel
    models:
      deepseek-flash:
        base-url: https://api.deepseek.com
        model-name: deepseek-flash
        api-key: ${DEEPSEEK_API_KEY}
        timeout: 600s
        max-tokens: 384000
        return-thinking: true
        send-thinking: true
        log-requests: true
        log-responses: true
      deepseek-v4-pro:
        base-url: https://api.deepseek.com
        model-name: deepseek-v4-pro
        api-key: ${DEEPSEEK_API_KEY}
        timeout: 600s
        max-tokens: 384000
        # DeepSeek 思考模式 + tools 要求回传历史轮次的 reasoning_content，否则第二轮起报 400
        return-thinking: true
        send-thinking: true
        log-requests: true
        log-responses: true

