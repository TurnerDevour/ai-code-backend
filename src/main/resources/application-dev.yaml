spring:
  application:
    name: ai-code-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: admin123
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      username: default
      password: admin123
      ttl: 3600 # Redis缓存过期时间，单位秒
      timeout: 10s
      connect-timeout: 5s
      jedis:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 10s
          time-between-eviction-runs: 30s

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  threads:
    virtual:
      enabled: true

# knife4j的增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

deploy:
  queue:
    workers: 3
    max-queue-size: 32
    sync-permits: 1
    # 同步部署的等待者上限（每实例）：额度被占满时，最多允许多少个请求短时间排队（超出直接提示改用异步接口）
    sync-max-waiters: 10
    # 同步部署的等待窗口（毫秒）：故意很短，只接住"刚好有构建结束"的情况，避免占住 Web 线程
    sync-wait-timeout-ms: 5000
    # 死信队列容量上限：不设上限时消费端长时间失败会把磁盘吃满；满了丢最老的（排查先看最近的）
    max-dead-letter-size: 1000
    # 后台巡检与告警：只在"正常 → 告警 / 告警 → 恢复"时打一条日志，不做周期刷屏
    monitor:
      enabled: true
      interval-seconds: 60
      # 等待队列深度阈值（默认 max-queue-size 的 3/4）
      waiting-threshold: 24
      # 死信阈值：正常应长期为 0，出现 1 条就该有人看
      dead-letter-threshold: 1
  # 部署任务恢复扫描：心跳过期落 failed、queued 超时重投（解决同步崩溃/数据库抖动卡死）
  recovery:
    enabled: true
    interval-seconds: 60
    deploying-timeout-seconds: 300
    queued-timeout-seconds: 900
    heartbeat-interval-seconds: 30
    batch-size: 50

logging:
  file:
    name: temp/logs/ai-code-backend.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7

ai:
  model-defaults:
    base-url: ${ALI_BAILIAN_BASE_URL}
    workspace-id: ${ALI_WORKSPACE_ID}
    api-key: ${ALI_BAILIAN_API_KEY}
    log-requests: true
    log-responses: true
  models:
    "[deepseek-v4.1-flash]":
    deepseek-v4-pro:
    "[qwen3.8-max]":
    "[qwen3.8-flash]":

# 配置cos对象存储
cos:
  client:
    host: ${COS_HOST}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET_NAME}
    secret-id: ${COS_SECRET_ID}
    secret-key: ${COS_SECRET_KEY}

# 应用部署
code:
  deploy-host: http://localhost
