spring:
  application:
    name: ai-code-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: admin123
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      username: default
      password: admin123
      ttl: 3600 # Redis缓存过期时间，单位秒
      timeout: 10s
      connect-timeout: 5s
      jedis:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 10s
          time-between-eviction-runs: 30s
  threads:
    virtual:
      enabled: true

# knife4j的增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

deploy:
  queue:
    workers: 4
    max-queue-size: 32

# 截图临时目录
screenshot:
  temp:
    ttl-minutes: 60 # 超过该时长仍未删除的截图目录视为垃圾
    sweep-minutes: 10 # 清理间隔

# 日志同时落盘（控制台之外）：模型调用、工具调用成功/失败都要能事后排查。
# 之前只看 IDEA 控制台，进程一重启证据就没了，"AI 说写了文件但磁盘上没有"这类问题无从定位。
logging:
  file:
    name: temp/logs/ai-code-backend.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7

# LangChain4j配置
langchain4j:
  open-ai:
    models:
      deepseek-flash:
        base-url: https://api.deepseek.com
        model-name: deepseek-flash
        api-key: ${DEEPSEEK_API_KEY}
        timeout: 600s
        max-tokens: 384000
        temperature: 0.3
        return-thinking: true
        send-thinking: true
        log-requests: true
        log-responses: true
      deepseek-v4-pro:
        base-url: https://api.deepseek.com
        model-name: deepseek-v4-pro
        api-key: ${DEEPSEEK_API_KEY}
        timeout: 600s
        max-tokens: 384000
        temperature: 0.3
        return-thinking: true
        send-thinking: true
        log-requests: true
        log-responses: true

# 配置cos对象存储
cos:
  client:
    host: ${COS_HOST}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET_NAME}
    secret-id: ${COS_SECRET_ID}
    secret-key: ${COS_SECRET_KEY}
