# =============================================================================
# Docker / docker-compose 部署专用配置
#
# 激活方式：环境变量 SPRING_PROFILES_ACTIVE=docker（docker-compose.yaml 已内置）
#
# 为什么单独写一个 profile，而不是复用 prod：
#   1. application-prod.yaml 里是线上机器的固定 IP 与明文密钥，而且它被 .gitignore 忽略，
#      CI / 新机器上根本不存在，镜像里不能依赖它；
#   2. 容器里 MySQL / Redis 是 compose 的服务名（mysql / redis），不是固定 IP；
#   3. 所有可变项都写成「环境变量 + 默认值」，只需要改 .env，不用改这个文件，
#      也不会有密钥被提交进仓库。
#
# 端口、context-path(/api)、mybatis-flex 扫描路径等沿用 application.yaml。
# =============================================================================
spring:
  application:
    name: ai-code-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval：MySQL 8 默认 caching_sha2_password，未走 SSL 时需要它才能完成首次认证
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/ai_code_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: ${MYSQL_USER:root_ai_code_db}
    password: ${MYSQL_PASSWORD:}
    hikari:
      # 每个聊天请求都要写用户消息、读历史、写 AI 消息；但 2核4G 机器上池子过大会把内存和
      # MySQL 连接数一起吃满，20 个连接足够（按需用 DB_POOL_MAX_SIZE 调）
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ttl: 3600
      # 连接池与命令超时必须按并发量显式配置：
      # Spring Session 与对话记忆存储各自建池，默认池过小 + 2s 超时会在并发下直接读超时（表现为 SSE 返回 500）
      timeout: 10s
      connect-timeout: 5s
      jedis:
        pool:
          # 2核4G 机器：够用即可，池子过大会挤占内存（Redis 自身也设了 maxmemory 兜底）
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: 10s
          time-between-eviction-runs: 30s
  # RabbitMQ：部署任务队列（详见 core/builder/mq 与 DOCKER.md）
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ai_code}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 10s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: false
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        # 启动时 broker 还没就绪不要直接失败：容器会不断重试，等 RabbitMQ 起来后自动恢复
        missing-queues-fatal: false
        default-requeue-rejected: false

# 部署构建队列（RabbitMQ）：容器里并发跑 npm install / npm run build，每个进程要吃 0.4~0.8G 内存 + 1 个核
# 4 核机器给 3（留 1 核给 Web/AI 请求）；内存吃紧或频繁 OOM 就降到 2
deploy:
  queue:
    # 同时作为消费者 concurrency：每实例同时构建数
    workers: ${DEPLOY_QUEUE_WORKERS:3}
    # 队列容量（x-max-length）：注意它是队列声明参数，改了必须重建队列，见 DOCKER.md
    max-queue-size: ${DEPLOY_QUEUE_MAX_SIZE:32}
    # 同步部署接口的独立额度（/app/deploy 需要当场返回地址，不能进 MQ 排队）
    sync-permits: ${DEPLOY_QUEUE_SYNC_PERMITS:1}
    # 同步部署的等待者上限（每实例）：额度被占满时最多允许多少个请求短时间排队，超出直接拒绝
    sync-max-waiters: ${DEPLOY_QUEUE_SYNC_MAX_WAITERS:10}
    # 同步部署的等待窗口（毫秒）：只接住"刚好有构建结束"的情况，避免请求线程被挂住几分钟
    sync-wait-timeout-ms: ${DEPLOY_QUEUE_SYNC_WAIT_TIMEOUT_MS:5000}
    # 死信队列容量上限（x-max-length）：不设上限时消费端长时间失败会把磁盘吃满；
    # 溢出丢最老的。注意它是队列声明参数，改了必须重建 deploy.dlq，见 DOCKER.md
    max-dead-letter-size: ${DEPLOY_QUEUE_MAX_DEAD_LETTER_SIZE:1000}
    # 后台巡检告警：等待队列积压 / 死信积压，只在状态切换时打一条日志
    monitor:
      enabled: ${DEPLOY_QUEUE_MONITOR_ENABLED:true}
      interval-seconds: ${DEPLOY_QUEUE_MONITOR_INTERVAL_SECONDS:60}
      waiting-threshold: ${DEPLOY_QUEUE_MONITOR_WAITING_THRESHOLD:24}
      dead-letter-threshold: ${DEPLOY_QUEUE_MONITOR_DEAD_LETTER_THRESHOLD:1}
  # 部署任务恢复扫描：心跳过期落 failed、queued 超时重投（解决同步崩溃/数据库抖动卡死）
  recovery:
    enabled: ${DEPLOY_RECOVERY_ENABLED:true}
    interval-seconds: ${DEPLOY_RECOVERY_INTERVAL_SECONDS:60}
    deploying-timeout-seconds: ${DEPLOY_RECOVERY_DEPLOYING_TIMEOUT_SECONDS:300}
    queued-timeout-seconds: ${DEPLOY_RECOVERY_QUEUED_TIMEOUT_SECONDS:900}
    heartbeat-interval-seconds: ${DEPLOY_RECOVERY_HEARTBEAT_INTERVAL_SECONDS:30}
    batch-size: ${DEPLOY_RECOVERY_BATCH_SIZE:50}

# knife4j 接口文档（生产默认开 basic 认证）
knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn
  basic:
    enable: ${KNIFE4J_BASIC_ENABLE:true}
    username: ${KNIFE4J_USER:admin}
    password: ${KNIFE4J_PASSWORD:admin123}

# AI 模型：模型清单（ai.models.*）在 application.yaml 里，这里只覆盖凭据与地址
ai:
  model-defaults:
    base-url: ${AI_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    workspace-id: ${AI_WORKSPACE_ID:ws-oo5tqem2rjnxpmxj}
    api-key: ${AI_API_KEY:}
    log-requests: ${AI_LOG_REQUESTS:false}
    log-responses: ${AI_LOG_RESPONSES:false}

# 腾讯云 COS：应用封面截图上传（不配也能跑，只是部署后没有封面图）
cos:
  client:
    host: ${COS_HOST:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}

mybatis-flex:
  configuration:
    log-impl: ''

# 应用部署地址前缀（生产统一入口 https://wlbc.top，80 只做 301 跳转）：
# 部署产物被复制到 temp/code_deploy/{deployKey}/，由 nginx 以 https://wlbc.top/dist/{deployKey}/ 对外提供；
# 这个值同时用于返回给前端和后台截图，所以必须是"容器内也能访问到"的地址（详见 DOCKER.md），
# 也必须是 https——前端页面是 https，给 http 地址会被浏览器当混合内容拦掉
code:
  deploy-host: ${CODE_DEPLOY_HOST:https://wlbc.top/dist}
