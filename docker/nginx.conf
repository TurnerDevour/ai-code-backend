# =============================================================================
# nginx：生产环境唯一对外入口（https://wlbc.top）
#
#   1) https://wlbc.top/api/...             -> 反向代理到 backend:8123（后端 context-path 就是 /api）
#   2) https://wlbc.top/                    -> 前端站点（ai-code-frontend 的构建产物 dist）
#   3) https://wlbc.top/dist/{deployKey}/   -> 用户生成并部署的静态站点
#                                              对应后端配置 code.deploy-host=https://wlbc.top/dist
#   4) http://wlbc.top/...                  -> 301 跳 https（保留原域名与路径，见下面 HTTP server）
#
# 证书（腾讯云免费 DV 证书，TrustAsia 签发）：
#   站点证书 + 中间证书：./src/main/resources/ssl_nginx/wlbc.top_bundle.crt（3 张，顺序不能乱）
#   私钥：                ./src/main/resources/ssl_nginx/wlbc.top.key
#   compose 把该目录只读挂到 /etc/nginx/ssl，因此这里直接按文件名引用。
#   有效期 2026-10-10 ~ 2027-01-08：**到期前必须换新证书**（腾讯云免费证书 90 天），
#   续期流程见 DOCKER.md 的"HTTPS 与证书续期"。文件换掉后 `docker compose restart nginx` 即可，配置不用改。
#
# 目录约定：
#   backend 把部署产物写到 /app/temp/code_deploy/{deployKey}/
#   本容器把 app-temp 卷只读挂到  /var/www/temp
#   compose 把宿主机的 frontend-dist 目录只读挂到 /var/www/frontend（前端产物，见 DEPLOY.md 第 10 步）
#
# 三者同域（都在 https://wlbc.top 下）是刻意的：前端 request.ts 用 withCredentials 带 Session Cookie，
# 跨站会被 SameSite 拦掉；相对路径（VITE_API_BASE_URL=/api）也只有同域才成立。
# 另外前端是 https 页面，页面里的资源地址（含 code.deploy-host 生成的封面/部署链接）必须也是 https，
# 否则会被浏览器当成混合内容拦掉——所以 CODE_DEPLOY_HOST 也要跟着改成 https。
# =============================================================================
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # 生成的前端产物里可能有较大的 js/图片
    client_max_body_size 32m;

    # SSE（AI 流式返回）不能被 gzip 包起来，否则前端拿不到逐步输出
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 后端上游：compose 服务名
    upstream backend_api {
        server backend:8123;
        keepalive 32;
    }

    # =============================================== HTTP（跳转 + 兜底直连）====
    # 规范域名（wlbc.top / www.wlbc.top）上一律 301 到 https。
    # 但有两种"非规范 Host"必须保留 http 直连，否则会被自己跳死：
    #   1. 探活：curl http://127.0.0.1/nginx-health（Host 是 IP）
    #   2. 截图兜底：NAT 回流被禁时 .env 会把 CODE_DEPLOY_HOST 改成
    #      http://host.docker.internal/dist（见 DEPLOY.md 第 8 步）。这个请求会带
    #      Host: host.docker.internal，一旦被 301 到 https，证书是按 wlbc.top 签发的，
    #      Chrome 会直接 NET::ERR_CERT_COMMON_NAME_INVALID，截图反而全失败。
    # 所以 default_server 只对 /nginx-health 与 /dist/ 提供 http 服务，其余（含直接用 IP 访问）
    # 跳到规范域名的 https。
    server {
        listen      80 default_server;
        server_name _;
        charset     utf-8;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # /dist -> /dist/（截图地址都以 /dist/{deployKey}/ 结尾，这里只是兜住手工敲的短地址）
        location = /dist {
            return 301 /dist/;
        }

        # 只读提供用户部署的静态站点（与 443 上的配置一致，只是这里走 http）
        location /dist/ {
            alias /var/www/temp/code_deploy/;
            index index.html;
            autoindex off;
            add_header Cache-Control "no-cache";
        }

        location / {
            return 301 https://wlbc.top$request_uri;
        }
    }

    # 规范域名：http 上只做跳转，不留任何业务
    server {
        listen      80;
        # 证书 SAN 同时覆盖 wlbc.top 与 www.wlbc.top，两个域名都接
        server_name wlbc.top www.wlbc.top;
        charset     utf-8;

        # 重定向用相对地址：即使把 NGINX_PORT 改成 8080 等非 80 端口也不会跳到 80
        absolute_redirect off;

        # 探活留在 80：本机/云厂商探测不必走 TLS（精确匹配优先级最高，不会被下面的跳转吃掉）
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # 其余全部跳 https：$host 保留访问时用的域名（wlbc.top / www.wlbc.top），
        # $request_uri 保留路径与查询串（含 /api 的 SSE 长连接）
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================= HTTPS（业务）====
    server {
        # http2 on 需要 nginx >= 1.25.1（compose 默认 nginx:latest / 1.27-alpine 都满足）；
        # 若把 NGINX_IMAGE_TAG 固定到更老的版本，这里要改回 `listen 443 ssl http2;`
        listen      443 ssl;
        http2       on;
        server_name wlbc.top www.wlbc.top;
        charset     utf-8;

        # 重定向用相对地址，理由同 80 端口
        absolute_redirect off;

        # ------------------------------------------------------------- 证书 ----
        ssl_certificate     /etc/nginx/ssl/wlbc.top_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/wlbc.top.key;

        # ------------------------------------------------------- TLS 参数 ----
        # 只留 TLS1.2/1.3：够用且避开已知弱协议；加密套件用 Mozilla intermediate 推荐集
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS：让浏览器此后只走 https（不带 includeSubDomains，避免误伤其它子域名）。
        # 注意：证书一旦过期，浏览器不会再给"继续访问"的入口，所以续期必须提前做；
        # 需要临时关闭时把这行连同 /api/、/dist/、= /index.html、/assets/、/ 里的同名行一起注释掉（共 5 处）。
        # nginx 的 add_header 不继承：某个 location 只要自己写了 add_header，就必须重复写上本行。
        # 如果续期没法保证自动化，先把 max-age 调小（例如 2592000 = 30 天），别一上来就锁一年。
        add_header Strict-Transport-Security "max-age=31536000" always;

        # ------------------------------------------------------------- API ----
        # 反向代理到 Spring Boot（context-path=/api，因此 URI 原样透传）
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # AI 代码生成是 SSE 长连接（/api/app/chat/gen/code），必须关缓冲并放宽超时，
            # 否则前端会"一次性拿到全部内容"甚至超时断开
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # 下载工程 zip 可能较大
            proxy_max_temp_file_size 0;

            # nginx 的 add_header 不继承：本 location 自己写了 add_header，就必须重复 HSTS，
            # 否则经代理的响应上没有 HSTS 头
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # --------------------------------------------------- 部署的静态站点 ----
        # /dist -> /dist/
        location = /dist {
            return 301 /dist/;
        }

        # 用 alias（而不是 root）：URL 去掉 /dist/ 前缀后直接对应 code_deploy 目录
        location /dist/ {
            alias /var/www/temp/code_deploy/;
            index index.html;
            autoindex off;
            # 重新部署后文件名不变，禁止强缓存，避免浏览器一直用旧产物
            add_header Cache-Control "no-cache";
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # 供 compose healthcheck / 排查使用（精确匹配，优先级最高）
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # ------------------------------------------------------- 前端站点 ----
        # 前端（ai-code-frontend）构建产物，由 compose 从宿主机 frontend-dist 目录挂载进来。
        # 放在最后只是因为读起来清楚：nginx 的前缀匹配按"最长匹配"选，与书写顺序无关。
        location = /index.html {
            root /var/www/frontend;
            # 入口 HTML 不能缓存，否则发版后浏览器还引用旧的 assets 文件名
            add_header Cache-Control "no-cache";
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # Vite 产物文件名带内容 hash，可以长缓存（只保留一条 Cache-Control，避免重复头）
        location /assets/ {
            root /var/www/frontend;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=31536000" always;
            access_log off;
        }

        # 前端是 SPA（Vue Router）：找不到的路径一律回 index.html，刷新深链接才不会 404
        location / {
            root /var/www/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
    }
}
