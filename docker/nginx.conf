# =============================================================================
# nginx：生产环境唯一对外入口（http://wlbc.top）
#
#   1) /api/...             -> 反向代理到 backend:8123（后端 context-path 就是 /api）
#                              生产访问地址：http://wlbc.top/api/...
#   2) /                    -> 前端站点（ai-code-frontend 的构建产物 dist）
#                              生产访问地址：http://wlbc.top/
#   3) /dist/{deployKey}/   -> 用户生成并部署的静态站点
#                              生产访问地址：http://wlbc.top/dist/{deployKey}/
#                              对应后端配置 code.deploy-host=http://wlbc.top/dist
#
# 目录约定：
#   backend 把部署产物写到 /app/temp/code_deploy/{deployKey}/
#   本容器把 app-temp 卷只读挂到  /var/www/temp
#   compose 把宿主机的 frontend-dist 目录只读挂到 /var/www/frontend（前端产物，见 DEPLOY.md 第 10 步）
#
# 三者同域（都在 http://wlbc.top 下）是刻意的：前端 request.ts 用 withCredentials 带 Session Cookie，
# 跨站会被 SameSite 拦掉；相对路径（VITE_API_BASE_URL=/api）也只有同域才成立。
# =============================================================================
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # 生成的前端产物里可能有较大的 js/图片
    client_max_body_size 32m;

    # SSE（AI 流式返回）不能被 gzip 包起来，否则前端拿不到逐步输出
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 后端上游：compose 服务名
    upstream backend_api {
        server backend:8123;
        keepalive 32;
    }

    server {
        listen      80;
        server_name wlbc.top;
        charset     utf-8;

        # 重定向用相对地址：即使把 NGINX_PORT 改成 8080 等非 80 端口也不会跳到 80
        absolute_redirect off;

        # ------------------------------------------------------------- API ----
        # 反向代理到 Spring Boot（context-path=/api，因此 URI 原样透传）
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # AI 代码生成是 SSE 长连接（/api/app/chat/gen/code），必须关缓冲并放宽超时，
            # 否则前端会"一次性拿到全部内容"甚至超时断开
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # 下载工程 zip 可能较大
            proxy_max_temp_file_size 0;
        }

        # --------------------------------------------------- 部署的静态站点 ----
        # /dist -> /dist/
        location = /dist {
            return 301 /dist/;
        }

        # 用 alias（而不是 root）：URL 去掉 /dist/ 前缀后直接对应 code_deploy 目录
        location /dist/ {
            alias /var/www/temp/code_deploy/;
            index index.html;
            autoindex off;
            # 重新部署后文件名不变，禁止强缓存，避免浏览器一直用旧产物
            add_header Cache-Control "no-cache";
        }

        # 供 compose healthcheck / 排查使用（精确匹配，优先级最高）
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # ------------------------------------------------------- 前端站点 ----
        # 前端（ai-code-frontend）构建产物，由 compose 从宿主机 frontend-dist 目录挂载进来。
        # 放在最后只是因为读起来清楚：nginx 的前缀匹配按"最长匹配"选，与书写顺序无关。
        location = /index.html {
            root /var/www/frontend;
            # 入口 HTML 不能缓存，否则发版后浏览器还引用旧的 assets 文件名
            add_header Cache-Control "no-cache";
        }

        # Vite 产物文件名带内容 hash，可以长缓存（只保留一条 Cache-Control，避免重复头）
        location /assets/ {
            root /var/www/frontend;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 前端是 SPA（Vue Router）：找不到的路径一律回 index.html，刷新深链接才不会 404
        location / {
            root /var/www/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
